[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.15.0"]

[project]
name = "seismic-rna"
authors = [
    {name="Matty Allan"},
    {name="Scott Grote"},
    {name="Justin Aruda"},
    {name="Yves Martin"},
    {name="Alberic de Lajarte"},
]
description = "Structure Ensemble Inference by Sequencing, Mutation Identification, and Clustering of RNA (SEISMIC-RNA)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "GPL-3.0-only"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "brotli >=1.2.0,<2",
    "click >=8.4.2,<9",
    "fastqsplitter >=1.2.0,<2",
    "jgo >=3.1.0,<4",
    "jinja2 >=3.1.6,<4",
    "matplotlib >=3.11.1,<4",
    "networkx >=3.6.1,<4",
    "numba >=0.67.0,<1",
    "numpy >=2.5.2,<3",
    "pandas >=3.0.5,<4",
    "plotly >=7.0.0,<8",
    "pyahocorasick >=2.3.1,<3",
    "pyyaml >=6.0.3,<7",
    "scipy >=1.18.1,<2",
    "tqdm >=4.70.0,<5",
]
dynamic = ["version"]

[project.scripts]
seismic = "seismicrna.main:cli"

[project.urls]
"Homepage" = "https://github.com/rouskinlab/seismic-rna"
"Bug Tracker" = "https://github.com/rouskinlab/seismic-rna/issues"

[tool.mesonpy]
build-dir = "build"

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba.*"
follow_imports = "skip"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
per-file-ignores = [
    "__init__.py:F401",
    "path_test.py:F403,F405",
    "collate.py:E501",
]
